<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Clinic Signage Player 설정</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="setup">
<main class="card">
  <header>
    <h1>Clinic Signage Player 설정</h1>
    <p class="muted" id="current"></p>
  </header>

  <section class="pair-cta">
    <div>
      <b>연결 코드로 연결 (권장)</b>
      <p class="hint">TV에 6자리 코드가 나오면 병원 관리자 화면의 디스플레이 설정에 입력하세요.</p>
    </div>
    <button type="button" id="pair">연결 코드 화면으로</button>
  </section>

  <form id="form" autocomplete="off">
    <label>또는 플레이어 주소 / TV 키 직접 입력
      <input id="playerUrl" placeholder="https://signage-lake.vercel.app/player.html?key=..." spellcheck="false">
    </label>
    <details>
      <summary>고급 설정</summary>
      <label>서버 주소
        <input id="baseUrl" spellcheck="false">
      </label>
      <label>출력 화면
        <select id="displayIndex"></select>
      </label>
      <label>정기 새로고침 시각 (매일)
        <select id="dailyReloadHour"></select>
      </label>
    </details>
    <label class="check"><input type="checkbox" id="autoStart" checked> 컴퓨터 로그인 시 자동 실행</label>
    <p id="error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="quit" class="ghost">프로그램 종료</button>
      <button type="button" id="cancel" class="ghost">돌아가기</button>
      <button type="submit" id="save">주소로 송출 시작</button>
    </div>
  </form>
  <footer class="muted small">
    <div id="hint"></div>
    <div id="logPath"></div>
  </footer>
</main>
<script src="setup.js"></script>
</body>
</html>
