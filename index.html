<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Clinic Signage</title>
  <link rel="stylesheet" href="/css/app.css?v=2.34.16">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-panel">
      <div class="eyebrow">CLINIC SIGNAGE</div>
      <h1>Clinic Signage</h1>
      <form id="loginForm" class="stack-lg">
        <label class="field pin-field"><span>PIN 번호</span><input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" minlength="4" maxlength="6" placeholder="••••••" required></label>
        <button class="btn primary block" type="submit">로그인</button>
        <p id="loginError" class="error hidden"></p>
      </form>
    </section>
  </main>
  <script src="/js/boot.js?v=2.34.16" data-entry="login" data-version="2.34.16" data-player-version="2.34.16"></script>
</body>
</html>
